name: Sync MO350AZ for Tachimanga

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-mo350az-tachimanga
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Generate validated legacy index and publish repo branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/fix_index.py "$RUNNER_TEMP/fix_index.py"
          git fetch --no-tags --depth=1 https://github.com/MO350AZ/extensions-no-nsfw.git repo
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git ls-remote --exit-code --heads origin repo > /dev/null; then
            git fetch --no-tags --depth=1 origin repo
            git checkout -B repo FETCH_HEAD
          else
            git checkout --orphan repo
          fi
          git rm -rf --ignore-unmatch .
          git clean -fd
          # Import only data/assets; never publish or execute upstream workflows/scripts.
          git restore --source="$upstream_sha" --staged --worktree -- apk icon jar repo.json index.pb index.json index.min.json index.html
          python3 "$RUNNER_TEMP/fix_index.py"
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("index.min.json").read_bytes()
          if not raw.startswith(b"["):
              raise SystemExit("Generated index does not begin with [")
          data = json.loads(raw)
          if not isinstance(data, list):
              raise SystemExit("Generated index is not an array")
          sources = [s for e in data for s in e["sources"]]
          if len(sources) < 20 or not all("lang" in s and "baseUrl" in s for s in sources[:20]):
              raise SystemExit("First 20 source objects failed lang/baseUrl verification")
          print(f"Verified [ and lang/baseUrl in first 20 of {len(sources)} sources")
          PY
          printf '%s\n' "$upstream_sha" > upstream-commit.txt
          git add index.min.json upstream-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m "Sync MO350AZ ${upstream_sha} and validate legacy index"
          git push origin HEAD:refs/heads/repo
